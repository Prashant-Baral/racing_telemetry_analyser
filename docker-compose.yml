version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: racing_db
    ports:
      - "5433:5432"  
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6380:6379"  

  api:
    build: .
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/racing_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY:  ${SECRET_KEY}
    volumes:
      - .:/app

  worker:
    build: .
    command: celery -A app.workers.celery_app worker --loglevel=info
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/racing_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY:  ${SECRET_KEY}
    volumes:
      - .:/app

volumes:
  pgdata:
